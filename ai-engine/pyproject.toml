[project]
name = "tolti-ai-engine"
version = "0.1.0"
description = "Sovereign AI engine for Tolti AI — Agent Router, OCR, Vision, RAG, verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "psycopg[binary,pool]>=3.2.0",
    "minio>=7.2.0",
    "numpy>=2.1.0",
    "tiktoken>=0.8.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.20",
    "pdfplumber>=0.11.0",
    "Pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=24.4.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
